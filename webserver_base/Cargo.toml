[package]
name = "webserver-base"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = []

# Handlebars registry, the embedded base layout, and the three template-data
# types.
templates = ["dep:handlebars", "dep:chrono"]

# First-party proxies for Plausible and the Sentry browser SDK, with
# true-client-IP resolution. Both are byte relays: nothing is parsed or
# re-reported, so a blocked third-party origin becomes a same-origin request
# without changing what the upstream receives.
analytics = ["dep:axum", "dep:reqwest"]

# sitemap.xml generation.
sitemap = ["dep:sitemap-rs", "dep:xml-builder", "dep:chrono"]

# RSS 2.0, Atom 1.0 and JSON Feed 1.1 for a site's one content stream.
# `md5` is for the ETag: a feed is the most-polled document a site serves, so a
# strong validator computed once at boot turns every unchanged poll into a 304.
feed = ["dep:quick-xml", "dep:chrono", "dep:regex", "dep:md5"]

# Sentry + tracing initialisation, in the one order that works.
observability = ["dep:sentry", "dep:tracing-subscriber"]

# Outbound Telegram Bot API notifier.
telegram = ["dep:reqwest", "dep:tokio"]

# The web server itself: builder, shared state, bootstrap, graceful shutdown,
# and the build-time static-asset pipeline (icon generation, content hashing,
# manifest emission). There is no separate `assets` gate: whether a server
# hashes anything is decided by the presence of `static/` on disk, not at
# compile time.
webserver = [
  "dep:axum",
  "dep:axum-extra",
  "dep:tower",
  "dep:tower-http",
  "dep:tokio",
  "dep:md5",
  "dep:regex",
  "dep:chrono",
  "dep:resvg",
  "dep:imagesize",
]

# Everything a site serving HTML needs. `WebServer::frontend` lives here.
# `feed` is folded in rather than left independently opt-in: `WebServer::feed`
# hangs off the same builder, and gating it separately would mean
# `cfg(all(feature = "pages", feature = "feed"))` through `server.rs` and
# `frontend.rs` to save a consumer two small crates.
pages = ["webserver", "templates", "sitemap", "analytics", "feed"]

# Todd Everett Griffin's personal defaults, including the embedded humans.txt.
preset = ["templates"]

full = [
  "templates",
  "analytics",
  "sitemap",
  "feed",
  "observability",
  "telegram",
  "webserver",
  "pages",
  "preset",
]

[dependencies]
# always present: tiny, and used by every kit
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# assets, analytics, webserver
axum = { workspace = true, optional = true }

# webserver
axum-extra = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

# webserver (serve loop), telegram (delivery worker)
tokio = { workspace = true, optional = true }

# static assets (content hashing + source-map rewriting)
md5 = { workspace = true, optional = true }
regex = { workspace = true, optional = true }

# static assets (generating the icon set from favicon.svg, and reading the
# social image's dimensions for og:image:width)
resvg = { workspace = true, optional = true }
imagesize = { workspace = true, optional = true }

# templates
handlebars = { workspace = true, optional = true }

# static assets (cache expiry), templates (copyright year), sitemap (lastmod)
chrono = { workspace = true, optional = true }

# analytics (proxying), telegram
reqwest = { workspace = true, optional = true, features = ["multipart"] }

# sitemap
sitemap-rs = { workspace = true, optional = true }
xml-builder = { workspace = true, optional = true }

# feed
quick-xml = { workspace = true, optional = true }

# observability
sentry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
# `test-util` gives tests a paused clock, so a drain-window overrun can be
# asserted without a test that actually sleeps for the drain window. Dev-only:
# consumers never build with it.
tokio = { workspace = true, features = ["test-util"] }

# Feed oracles. `roxmltree` proves well-formedness with a parser that is not the
# one that wrote the document, because a generator checked by its own parser
# waves through exactly the emit-and-accept bug the check exists for. `rss` and
# `atom_syndication` implement the specs, so a round-trip through them proves
# conformance rather than mere syntax. Dev-only: consumers never build them.
roxmltree = { workspace = true }
rss = { workspace = true }
atom_syndication = { workspace = true }

[package.metadata.docs.rs]
all-features = true
