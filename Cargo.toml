[workspace]
members = ["webserver_base", "template_web_server"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["Todd Everett Griffin <tgriffin115@gmail.com>"]
readme = "README.md"
repository = "https://github.com/goddtriffin/webserver-base"
homepage = "https://www.toddgriffin.me/"
description = "A Rust library which contains shared logic for all of my webserver projects."
license-file = "LICENSE"
keywords = ["Todd", "Everett", "Griffin", "webserver", "base"]
categories = ["web-programming"]
include = ["**/*.rs", "Cargo.toml", ".clippy.toml", "LICENSE", "README.md"]

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
unfulfilled_lint_expectations = { level = "forbid", priority = 1 }

[workspace.lints.clippy]
allow_attributes = { level = "forbid", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
nursery = { level = "allow", priority = 0 }
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

[workspace.dependencies]
# async runtime
tokio = { version = "1.53.1", features = ["full", "tracing"] }

# http
axum = { version = "0.8.9", features = [
  "ws",
  "multipart",
  "tracing",
  "macros",
  "tokio",
] }
axum-extra = "0.12.6"
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }

# tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# serde
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# errors
thiserror = "2.0.20"

# error monitoring
sentry = { version = "0.49.1", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "tracing",
  "tower",
  "reqwest",
  "rustls",
] }

# crypto
md5 = "0.8.1"

# sitemap
sitemap-rs = "0.4.0"
xml-builder = "0.5.4"
chrono = { version = "0.4.45", features = ["default", "serde"] }

# templating
handlebars = "6.4.4"

# regex
regex = "1.13.1"

# my homebrew libraries
plausible-rs = "0.1.5"
