[workspace]
members = ["webserver_base", "template_web_server"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
authors = ["Todd Everett Griffin <tgriffin115@gmail.com>"]
readme = "README.md"
repository = "https://github.com/goddtriffin/webserver-base"
homepage = "https://www.toddgriffin.me/"
description = "A Rust library which contains shared logic for all of my webserver projects."
license-file = "LICENSE"
keywords = ["Todd", "Everett", "Griffin", "webserver", "base"]
categories = ["web-programming"]
# `assets/**` is load-bearing: the base layout and humans.txt are pulled in with
# `include_str!`, so omitting them here compiles locally and fails for every
# consumer of the published crate.
include = [
  "**/*.rs",
  "assets/**",
  "Cargo.toml",
  "LICENSE",
  "README.md",
]

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = 0 }
unfulfilled_lint_expectations = { level = "forbid", priority = 1 }
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "allow", priority = 0 }
allow_attributes = { level = "forbid", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }

[workspace.lints.cargo]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
manual_readme = { level = "allow", priority = 1 }

[workspace.dependencies]
# async runtime
tokio = { version = "1.54.1", features = ["full", "tracing"] }

# http
axum = { version = "0.8.9", features = [
  "ws",
  "multipart",
  "tracing",
  "macros",
  "tokio",
] }
axum-extra = { version = "0.12.6", features = ["routing"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["full"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
] }

# metrics
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# serde
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# errors
thiserror = "2.0.21"

# error monitoring
sentry = { version = "0.49.5", default-features = false, features = [
  "backtrace",
  "contexts",
  "panic",
  "debug-images",
  "tracing",
  "tower",
  "reqwest",
  "rustls",
] }

# crypto
md5 = "0.8.1"

# static assets: SVG -> raster for the generated icon set. `resvg` re-exports
# both `usvg` (parse) and `tiny_skia` (pixels), so it is the only name needed.
# Default features off: no system fonts, so a favicon.svg must carry paths
# rather than text.
resvg = { version = "0.50.0", default-features = false, features = ["text"] }

# static assets: reads image dimensions from header bytes, for og:image:width.
imagesize = "0.15.0"

# sitemap
sitemap-rs = "0.7.1"
chrono = { version = "0.4.45", features = ["default", "serde"] }

# feeds: writes RSS/Atom. `BytesText::new` escapes element text, and feed
# content is arbitrary post HTML, where one unescaped `&` makes every reader
# reject the whole document. `sitemap-rs` writes with it too, so it is already
# in the tree for any site with the `pages` kit.
quick-xml = "0.42.0"

# feeds (dev only): three independent parsers used as oracles in tests.
# `roxmltree` proves well-formedness without the circularity of validating
# quick-xml's output with quick-xml; `rss` and `atom_syndication` prove spec
# conformance. Consumers never build any of them.
roxmltree = "0.21.2"
rss = "2.1.2"
atom_syndication = "0.12.10"

# templating
handlebars = "6.4.4"

# regex
regex = "1.13.1"
