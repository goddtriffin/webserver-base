services:
  template_web_server:
    image: goddtriffin/template-web-server:latest
    container_name: template_web_server
    restart: unless-stopped
    ports:
      # host side is set by `make docker_run` (see free-port); container side is always 8080
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - ./.template-web-server.env
