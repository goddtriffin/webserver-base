[package]
name = "template-web-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

# A library as well as a binary so the tests can build the exact server `main`
# runs; a binary-only crate would leave them copying the builder chain.
[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "template-web-server"

[lints]
workspace = true

# The whole dependency list. Everything this server used to name directly —
# axum, tower, tower-http, sentry, tracing-subscriber, sitemap-rs, xml-builder,
# chrono, reqwest, serde, serde_json, serde_yaml, futures, rand — is now
# reached through the kits it enables here. `pages` implies `webserver`,
# `templates`, `sitemap` and `analytics`.
[dependencies]
webserver-base = { path = "../webserver_base", features = [
  "pages",
  "observability",
  "preset",
] }

# The test drives the router with `tower::ServiceExt::oneshot`, which is how
# every consumer tests without binding a socket. Dev-only: the binary is
# unaffected.
[dev-dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
