[package]
name = "template-web-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
license-file.workspace = true
keywords.workspace = true
categories.workspace = true
include.workspace = true

[[bin]]
path = "src/main.rs"
name = "template-web-server"

[lints]
workspace = true

# The whole dependency list. Everything this server used to name directly —
# axum, tower, tower-http, sentry, tracing-subscriber, sitemap-rs, xml-builder,
# chrono, reqwest, serde, serde_json, serde_yaml, futures, rand — is now
# reached through the kits it enables here. `pages` implies `webserver`,
# `templates`, `sitemap` and `analytics`.
[dependencies]
webserver-base = { path = "../webserver_base", features = [
  "pages",
  "observability",
  "preset",
] }
