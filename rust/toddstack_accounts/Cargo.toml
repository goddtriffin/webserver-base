[package]
name = "toddstack-accounts"
# Versioned on its own, not with the workspace (webserver-base's version).
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
description = "Client for Todd Griffin's Projects accounts: OIDC sign-in, token checks, signed webhooks, friends and events."
license-file.workspace = true
keywords = ["oidc", "accounts", "friends", "toddstack"]
categories = ["authentication", "web-programming"]
include = ["**/*.rs", "Cargo.toml", "LICENSE", "README.md"]

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["form"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = "2.5.8"
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11.1"
hmac = "0.13.0"
subtle = "2.6.1"
base64 = "0.23.1"
getrandom = "0.4.3"
hex = "0.4.3"

[dev-dependencies]
tokio = { workspace = true }
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
base64 = "0.23.1"
